name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare named APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk Fake-GPS-by-Horlakz-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fake-GPS-by-Horlakz-debug
          path: Fake-GPS-by-Horlakz-debug.apk
          if-no-files-found: error
